<section class="container" aria-labelledby="titulo-cadastro"><h1 id="titulo-cadastro">Cadastro de apoiadores</h1><p>Preencha os dados para demonstrar seu interesse.</p><form id="cadastroForm" novalidate><fieldset><legend>Dados pessoais</legend><label for="nome">Nome completo</label><input id="nome" name="nome" required minlength="3"><label for="email">E-mail</label><input type="email" id="email" name="email" required><label for="telefone">Telefone</label><input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(11) 99999-9999"><label for="interesse">Como deseja ajudar?</label><select id="interesse" name="interesse" required><option value="">Selecione</option><option value="voluntariado">Voluntariado</option><option value="doacao">Doação</option><option value="divulgacao">Divulgação</option></select><label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem" maxlength="500"></textarea></fieldset><button class="btn" type="submit">Enviar cadastro</button></form><div id="cadastrosSalvos" aria-live="polite"></div></section>
